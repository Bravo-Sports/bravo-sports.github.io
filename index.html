<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const mapa = L.map('mapa', {zoomControl: false}).setView([36.54, -4.61], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18,
  attribution: '© OpenStreetMap · OpenSeaMap'}).addTo(mapa);
L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {maxZoom: 18}).addTo(mapa);
const capaEstela = L.layerGroup().addTo(mapa);
const colVel = v => 'hsl(' + Math.round(240 - Math.min(1, (v || 0) / 8) * 240) + ',85%,45%)';   // 0 kn azul, 8+ rojo
function pintaEstela(r) {                     // la estela por tramos, del color de la velocidad, y una marca cada hora
  capaEstela.clearLayers();
  for (let i = 1; i < r.length; i++)
    L.polyline([[r[i - 1][1], r[i - 1][2]], [r[i][1], r[i][2]]], {color: colVel(r[i][3]), weight: 4, opacity: .9, interactive: false}).addTo(capaEstela);
  let ult = null;
  for (let h = Math.ceil((r.length ? r[0][0] : 0) / 3600) * 3600; r.length && h <= r[r.length - 1][0]; h += 3600) {
    const q = r.reduce((a, b) => Math.abs(b[0] - h) < Math.abs(a[0] - h) ? b : a);
    if (Math.abs(q[0] - h) > 1200) continue;                     // sin punto cerca de esa hora
    if (ult && mapa.distance([ult[1], ult[2]], [q[1], q[2]]) < 300) continue;   // parado: una sola marca
    ult = q;
    const d = new Date(h * 1000);
    L.circleMarker([q[1], q[2]], {radius: 3, color: '#263238', weight: 1, fillColor: '#fff', fillOpacity: 1})
      .bindTooltip(d.getHours() + 'h', {permanent: true, direction: 'left', className: 'rotulo hora'})
      .addTo(capaEstela);
  }
}
function grafica(titulo, pts, unidad, color, dec = 1) {   // linea SVG de [t, valor]; nada si no hay datos
  pts = pts.filter(p => p[1] != null);
  if (pts.length < 2) return '';
  const W = 300, H = 56, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const mn = Math.min(...pts.map(p => p[1])), mx = Math.max(...pts.map(p => p[1]));
  let lo = mn, hi = mx;
  if (hi - lo < (unidad === 'hPa' ? 2 : 1)) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
  const x = t => (t - t0) / Math.max(1, t1 - t0) * W, y = v => H - 4 - (v - lo) / (hi - lo) * (H - 8);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join('');
  const hora = t => new Date(t * 1000).toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
  return '<div class="graf"><div class="tenue">' + titulo + ': ahora <b>' + coma(pts[pts.length - 1][1], dec) + ' ' + unidad + '</b> · mín ' +
    coma(mn, dec) + ' · máx ' + coma(mx, dec) + '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + titulo + '"><path d="' + d +
    '" fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>' +
    '<div class="tenue eje"><span>' + hora(t0) + '</span><span>' + hora(t1) + '</span></div></div>';
}
let grafAbierta = false;
function pintaGrafica(s) {
  const el = document.getElementById('graf');
  const h = s && s.length > 1 ? grafica('Velocidad', s.map(p => [p[0], p[1]]), 'kn', '#1565c0') +
            grafica('Viento', s.map(p => [p[0], p[2]]), 'kn', '#2e7d32') + grafica('Presión', s.map(p => [p[0], p[3]]), 'hPa', '#6a1b9a', 0) : '';
  el.innerHTML = h ? '<details' + (grafAbierta ? ' open' : '') + '><summary>Gráfica de las últimas 24 h</summary>' + h + '</details>' : '';
  const dt = el.querySelector('details');
  if (dt) dt.addEventListener('toggle', e => { grafAbierta = e.target.open; });
}
const capaRegata = L.layerGroup().addTo(mapa), capaRivales = L.layerGroup().addTo(mapa);
const sugerida = L.polyline([], {color: '#1565c0', weight: 3, dashArray: '8 6', opacity: .85}).addTo(mapa);
// viento (barbas), corriente y ola de las proximas 24 h, de la Pi
// boton para volver a centrar el mapa en el barco
const Centrar = L.Control.extend({
  options: {position: 'topright'},
  onAdd() {
    const b = L.DomUtil.create('button', 'centrar');
    b.type = 'button'; b.title = 'Centrar en el barco'; b.setAttribute('aria-label', 'Centrar en el barco');
    b.innerHTML = '<svg width="22" height="22" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="6" fill="none" stroke="currentColor" stroke-width="2"/>' +
      '<circle r="2" fill="currentColor"/><path d="M0,-11V-7M0,7V11M-11,0H-7M7,0H11" stroke="currentColor" stroke-width="2"/></svg> Barco';
    L.DomEvent.disableClickPropagation(b);
    L.DomEvent.on(b, 'click', () => { if (barco) mapa.setView(barco.getLatLng(), Math.max(mapa.getZoom(), 11)); });
    return b;
  },
});
new Centrar().addTo(mapa);
const capaAis = L.layerGroup(), capaNogo = L.layerGroup();
const capaViento = L.layerGroup(), capaCorr = L.layerGroup(), capaOlas = L.layerGroup();
// ANIMACION: particulas que se mueven con el viento o con la corriente (una de las dos, se elige en la ficha)
// lo que se ve de cada cosa (se elige en la ficha y lo recuerda el navegador)
let modos = {viento: 'anima', corriente: 'flechas', olas: 'si', ais: 'no', nogo: 'si'};
try { Object.assign(modos, JSON.parse(localStorage.getItem('modos') || '{}')); } catch (e) {}
const Flujo = L.Layer.extend({
  initialize(tipo) { this.tipo = tipo; },
  onAdd(m) {
    this.c = L.DomUtil.create('canvas', 'flujo', m.getPanes().overlayPane);
    this.c.style.pointerEvents = 'none';
    m.on('movestart zoomstart', this.para, this);
    m.on('moveend resize', this.arranca, this);
    this.arranca();
  },
  onRemove(m) { this.para(); this.c.remove(); m.off('movestart zoomstart', this.para, this); m.off('moveend resize', this.arranca, this); },
  para() { cancelAnimationFrame(this.raf); this.raf = 0; if (this.c) this.c.getContext('2d').clearRect(0, 0, this.c.width, this.c.height); },
  arranca() {
    this.para();
    const m = this._map, t = m.getSize(), c = this.c, x = c.getContext('2d');
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    c.width = t.x; c.height = t.y;
    const campo = campoFlujo(this.tipo);
    if (!campo) return;
    const viento = this.tipo === 'viento';
    const nueva = () => ({x: Math.random() * t.x, y: Math.random() * t.y, edad: Math.random() * 100});
    const ps = Array.from({length: Math.round(t.x * t.y / (viento ? 450 : 350))}, nueva);
    const paso = () => {
      x.globalCompositeOperation = 'destination-in';          // estela que se va borrando
      x.fillStyle = 'rgba(0,0,0,.94)'; x.fillRect(0, 0, t.x, t.y);
      x.globalCompositeOperation = 'source-over'; x.lineWidth = viento ? 2 : 2.2;
      for (const p of ps) {
        const ll = m.containerPointToLatLng([p.x, p.y]), v = campo(ll.lat, ll.lng);
        if (!v || ++p.edad > 110) { Object.assign(p, nueva(), {edad: 0}); continue; }
        const k = Math.hypot(v[0], v[1]);
        if (k < .01) { Object.assign(p, nueva(), {edad: 0}); continue; }
        // pixeles por fotograma: el viento proporcional; la corriente (decimas de nudo) con un minimo para que se vea moverse
        const f = viento ? .16 : Math.max(.7, k * 2.2) / k, nx = p.x + v[0] * f, ny = p.y - v[1] * f;
        x.strokeStyle = viento ? colViento(k) : (k < .5 ? '#4fc3f7' : k < 1 ? '#0288d1' : '#01579b');
        x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(nx, ny); x.stroke();
        p.x = nx; p.y = ny;
        if (p.x < 0 || p.y < 0 || p.x > t.x || p.y > t.y) Object.assign(p, nueva(), {edad: 0});
      }
      this.raf = requestAnimationFrame(paso);
    };
    this.raf = requestAnimationFrame(paso);
  },
});
const flujoV = new Flujo('viento'), flujoC = new Flujo('corriente');
// desplegable "Capas" debajo del boton del barco: que se ve de cada cosa
const Opciones = L.Control.extend({
  options: {position: 'topright'},
  onAdd() {
    const d = L.DomUtil.create('div', 'opciones');
    d.innerHTML = '<button type="button" class="centrar" aria-expanded="false">☰ Capas</button><div class="panel" hidden>' +
      [['viento', 'Viento', [['anima', 'Animado'], ['barbas', 'Barbas'], ['no', 'No']]],
       ['corriente', 'Corriente', [['anima', 'Animada'], ['flechas', 'Flechas'], ['no', 'No']]],
       ['olas', 'Olas', [['si', 'Sí'], ['no', 'No']]], ['ais', 'AIS', [['si', 'Sí'], ['no', 'No']]],
       ['nogo', 'Zonas NOGO', [['si', 'Sí'], ['no', 'No']]]].map(([k, n, ops]) => '<div class="anima"><span class="que">' + n + '</span>' +
        ops.map(([v, t]) => '<label><input type="radio" name="' + k + '" value="' + v + '"' + (modos[k] === v ? ' checked' : '') + '> ' + t + '</label>').join('') +
        '</div>').join('') + '</div>';
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    const b = d.querySelector('button'), pn = d.querySelector('.panel');
    b.addEventListener('click', () => { pn.hidden = !pn.hidden; b.setAttribute('aria-expanded', String(!pn.hidden)); });
    for (const x of d.querySelectorAll('input')) x.addEventListener('change', e => {
      modos[e.target.name] = e.target.value;
      try { localStorage.setItem('modos', JSON.stringify(modos)); } catch (y) {}
      aplicaModos(); pintaCapa();
    });
    return d;
  },
});
setTimeout(() => new Opciones().addTo(mapa));     // cuando 'modos' y las capas ya existen
function aplicaModos() {
  const pon = (capa, si) => { if (si && !mapa.hasLayer(capa)) capa.addTo(mapa); if (!si && mapa.hasLayer(capa)) mapa.removeLayer(capa); };
  pon(flujoV, modos.viento === 'anima'); pon(capaViento, modos.viento === 'barbas');
  pon(flujoC, modos.corriente === 'anima'); pon(capaCorr, modos.corriente === 'flechas');
  pon(capaOlas, modos.olas === 'si');
  pon(capaAis, modos.ais === 'si'); pon(capaNogo, modos.nogo === 'si');
}
let corrFina = null, corrH = null;
function preparaCorr(c) {                    // indice de cada celda de mar en los valores de cada paso
  const idx = new Int32Array(c.ni * c.nj).fill(-1);
  let k = 0;
  for (let n = 0; n < c.mar.length; n++) if (c.mar[n] === '1') idx[n] = k++;
  return Object.assign(c, {idx});
}
function campoFino(t) {                       // corriente IBI a ~2,8 km del paso mas cercano a 't'
  const c = corrFina;
  if (!c) return null;
  const p = c.pasos.reduce((a, b) => Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a);
  const uv = (i, j) => { if (i < 0 || j < 0 || i >= c.ni || j >= c.nj) return null; const k = c.idx[i * c.nj + j]; return k < 0 ? null : [p.uv[2 * k] / 10, p.uv[2 * k + 1] / 10]; };
  return (la, lo) => {
    const fi = (la - c.la0) / c.dla, fj = (lo - c.lo0) / c.dlo;
    if (!uv(Math.round(fi), Math.round(fj))) return null;      // tierra (el punto de la rejilla mas cercano)
    const i = Math.floor(fi), j = Math.floor(fj), di = fi - i, dj = fj - j;
    let su = 0, sv = 0, sw = 0;
    for (const [a, b, w] of [[i, j, (1 - di) * (1 - dj)], [i + 1, j, di * (1 - dj)], [i, j + 1, (1 - di) * dj], [i + 1, j + 1, di * dj]]) {
      const v = uv(a, b);
      if (v) { su += v[0] * w; sv += v[1] * w; sw += w; }
    }
    return sw > 0 ? [su / sw, sv / sw] : null;
  };
}
function campoFlujo(tipo) {          // (lat, lon) -> [este, norte] en nudos, interpolado en la rejilla; null fuera
  const p = capa && (capa.pasos.find(x => x.t === pasoT) || capa.pasos[0]);
  if (!p || tipo === 'nada') return null;
  if (tipo === 'corriente' && corrFina) return campoFino(p.t);
  // viento: rejilla de 0,125 grados; corriente: la suya (~0,056), y solo donde la hay (en tierra no)
  const fina = tipo === 'corriente' && p.corr && p.corr.length;
  const pts = fina ? p.corr.map(c => [c[0], c[1], c[2], c[3]]) : p.puntos.map(q => tipo === 'viento' ? [q[0], q[1], q[2], q[3] + 180] : [q[0], q[1], q[4], q[5]]);
  // paso de la rejilla: (ultimo - primero) / (n - 1), en lat y en lon por separado (los valores vienen redondeados)
  const paso = i => { const v = [...new Set(pts.map(q => q[i]))].sort((a, b) => a - b); return v.length > 1 ? (v[v.length - 1] - v[0]) / (v.length - 1) : .125; };
  const DA = fina ? paso(0) : .125, DO = fina ? paso(1) : .125;
  const la0 = Math.min(...pts.map(q => q[0])), lo0 = Math.min(...pts.map(q => q[1])), g = new Map(), minimo = fina ? .01 : .25;
  for (const [la, lo, kn, a] of pts) {                            // a: hacia donde va
    if (kn == null || a == null) continue;
    const r = a * Math.PI / 180;
    g.set(Math.round((la - la0) / DA) + ',' + Math.round((lo - lo0) / DO), [kn * Math.sin(r), kn * Math.cos(r)]);
  }
  return (la, lo) => {
    const fi = (la - la0) / DA, fj = (lo - lo0) / DO, i = Math.floor(fi), j = Math.floor(fj), di = fi - i, dj = fj - j;
    let su = 0, sv = 0, sw = 0;
    for (const [a, b, w] of [[i, j, (1 - di) * (1 - dj)], [i + 1, j, di * (1 - dj)], [i, j + 1, (1 - di) * dj], [i + 1, j + 1, di * dj]]) {
      const v = g.get(a + ',' + b);
      if (v) { su += v[0] * w; sv += v[1] * w; sw += w; }
    }
    // corriente: solo si el punto de la rejilla mas cercano es mar (en el Estrecho a veces solo hay una fila)

mapa.on('click', e => {             // tocar el mapa: viento, corriente y ola de ese punto
  const p = capa && (capa.pasos.find(x => x.t === pasoT) || capa.pasos[0]);
  if (!p) return;
  let q = null, dm = 1e9;
  for (const x of p.puntos) { const d = Math.hypot(x[0] - e.latlng.lat, (x[1] - e.latlng.lng) * .8); if (d < dm) { dm = d; q = x; } }
  if (!q || dm > .2) return;
  const fc = corrFina && campoFino(p.t), cv = fc && fc(e.latlng.lat, e.latlng.lng);
  if (cv) { q = q.slice(); q[4] = Math.hypot(cv[0], cv[1]); q[5] = Math.round((Math.atan2(cv[0], cv[1]) * 180 / Math.PI + 360) % 360); }
  else if (fc) { q = q.slice(); q[4] = q[5] = null; }
  L.popup().setLatLng(e.latlng).setContent(textoPunto(q) + '<br><span style="color:#5b6b76">' + fecha(p.t * 1000) + '</span>').openOn(mapa);
});
function textoPunto(q) {
  const [la, lo, kn, de, ck, ch, hs, tp, od] = q;

  if (!barco) barco = L.marker([u.lat, u.lon]).addTo(mapa);

  const vg = vientoEn(u.lat, u.lon);              // el real de los instrumentos; si falta, el de la prevision
  const lr = lineaRumbo(u, {de: u.twd != null ? u.twd : vg && vg.de, kn: u.tws != null ? u.tws : vg && vg.kn}, u.nombre || 'Mi barco');
  if (lr && !barco.getTooltip()) barco.bindTooltip('', {permanent: true, direction: 'right', offset: [12, 0], className: 'rotulo rotuloBarco'});
  if (barco.getTooltip()) barco.setTooltipContent(lr || '');
  if (primera) {                                    // al abrir: todo el rastro (o el barco si no hay)
    const caja = L.latLngBounds([[u.lat, u.lon]]);              // rastro, regata y rivales
    for (const q of r) caja.extend([q[1], q[2]]);
    if (ru) for (const q of ru.puntos) caja.extend(q);
    capaRegata.eachLayer(l => caja.extend(l.getLatLng ? l.getLatLng() : l.getBounds()));
    capaRivales.eachLayer(l => caja.extend(l.getLatLng ? l.getLatLng() : l.getBounds()));
    const tapa = document.getElementById('ficha').offsetHeight + 30;
    mapa.fitBounds(caja, {maxZoom: 13, paddingTopLeft: [40, 40], paddingBottomRight: [40, tapa]});
    primera = false;
  }
  const edad = Date.now() / 1000 - u.t;
  const p = [];
  if (u.sog != null) p.push('<span>Velocidad <b>' + coma(u.sog) + ' nudos</b></span>');
  if (u.cog != null && (u.sog || 0) > 0.5) p.push('<span>Rumbo <b>' + Math.round(u.cog) + '°</b></span>');
  if (u.tws != null) p.push('<span>Viento <b>' + Math.round(u.tws) + ' nudos</b>' + (u.twd != null ? ' del ' + Math.round(u.twd) + '°' : '') + '</span>');
  document.getElementById('txt').innerHTML = '<div class="datos">' + (p.join('') || 'En puerto o parado') + '</div>';
  const h = document.getElementById('hora');
  h.textContent = 'Última posición ' + hace(edad) + ' · ' + new Date(u.t * 1000).toLocaleString('es-ES', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'}) +
    (u.fuente === 'ais' ? ' · por AIS: el barco está sin internet' : '');
  h.className = edad > 7200 ? 'tenue viejo' : 'tenue';
  if (d.ejemplo) { h.textContent = 'DATOS DE EJEMPLO: la Pi del barco aún no ha subido los reales'; h.className = 'tenue viejo'; }
}
{                                                // ficha plegable; el navegador lo recuerda
  const f = document.getElementById('ficha'), b = document.getElementById('plegar');
  const pon = p => { f.classList.toggle('plegada', p); b.setAttribute('aria-expanded', String(!p)); };
  try { pon(localStorage.getItem('plegada') === '1'); } catch (e) {}
  b.addEventListener('click', () => {
    const p = !f.classList.contains('plegada'); pon(p);
    try { localStorage.setItem('plegada', p ? '1' : '0'); } catch (e) {}
  });
}
carga();
setInterval(carga, 60000);                      // la Pi sube cada 2 min navegando
</script>
